name: hardware

# Only the instrument: simulator and firmware. The phone side is mobile/ (mobile.yml).
on:
  push:
    paths:
      - 'hardware/**'
      - '.github/workflows/hardware.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - '.github/workflows/hardware.yml'

jobs:
  simulator:
    name: simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: fake board
        working-directory: hardware
        run: python3 sim/test_fake_board.py

  firmware:
    name: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: esp32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install OneWire DallasTemperature "GFX Library for Arduino"
      - name: 17_stream (XIAO ESP32-S3)
        working-directory: hardware
        run: arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32S3 firmware/17_stream
      - name: 21_box3_face (ESP32-S3-BOX-3)
        working-directory: hardware
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3box firmware/21_box3_face
