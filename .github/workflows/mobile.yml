name: mobile

# Only the Flutter app. Nothing here runs for a change to the rest of the repository.
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

jobs:
  app:
    name: flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          cache: true
      - name: pub get
        working-directory: mobile
        run: flutter pub get
      - name: analyze
        working-directory: mobile
        run: flutter analyze
      - name: test
        working-directory: mobile
        run: flutter test
      - name: build apk
        working-directory: mobile
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: peel-mobile-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
