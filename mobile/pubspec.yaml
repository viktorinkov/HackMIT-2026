name: peel_mobile
description: "Peel — scan a bottle, imprint and pill, then understand the result."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  usb_serial: ^0.5.2
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  waveform_flutter: ^1.2.0
  rive: ^0.14.11

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/rive/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

# Vendored Gradle 9 compatibility patch.
dependency_overrides:
  usb_serial:
    path: packages/usb_serial
