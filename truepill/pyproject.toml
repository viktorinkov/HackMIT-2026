[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "truepill"
version = "0.1.0"
description = "Peel bench instrument classification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[tool.setuptools]
packages = ["truepill"]
package-dir = {truepill = "."}

[tool.setuptools.package-data]
truepill = ["data/library/*.json"]
